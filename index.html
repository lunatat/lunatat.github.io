<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Star AI - Launching Soon</title>
    <!-- Use Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #09090e 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            position: relative;
        }

        /* Draggable Gold Coin */
        #scratch-coin {
            position: absolute;
            left: 5%;
            top: calc(50% - 40px);
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffd700, #b8860b, #ffd700);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.8), inset 0 0 5px rgba(0, 0, 0, 0.8);
            border: 4px solid #fff8dc;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            z-index: 100;
            user-select: none;
            touch-action: none;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        #scratch-coin.dragging {
            cursor: grabbing;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(255, 255, 255, 1);
            transform: scale(1.1);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .coin-inner {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            pointer-events: none;
        }

        /* Fullscreen canvas for star particles */
        #star-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Container for the scratch game */
        .container {
            position: relative;
            width: 90vw;
            max-width: 650px;
            height: 400px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 242, 254, 0.1);
            z-index: 10;
        }

        /* The message revealed underneath */
        .reveal-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            /* Subtle breathing animation for the glowing container */
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px rgba(0, 242, 254, 0.05);
            }

            100% {
                box-shadow: 0 0 50px rgba(0, 242, 254, 0.2);
            }
        }

        .reveal-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0px 4px 20px rgba(0, 242, 254, 0.2);
        }

        .reveal-content p {
            font-size: 1.3rem;
            font-weight: 300;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .reveal-content p span {
            font-weight: 700;
            color: #00f2fe;
        }

        /* The scratchable overlay */
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            cursor: crosshair;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .reveal-content h1 {
                font-size: 2.5rem;
            }

            .reveal-content p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Background Star Particle System -->
    <canvas id="star-canvas"></canvas>

    <!-- Draggable Gold Coin -->
    <div id="scratch-coin">
        <div class="coin-inner" id="coin-icon"></div>
    </div>

    <!-- Center Interactive Card -->
    <div class="container">
        <!-- Hidden content to reveal -->
        <div class="reveal-content">
            <h1>Launching Soon.</h1>
            <p>Catch the Future at <span>All-Star-Ai</span>.<br><br>Smart Equipment & Ai to train the next All Star.</p>
        </div>
        <!-- Scratchable foreground cover -->
        <canvas id="scratch-canvas"></canvas>
    </div>

    <script>
        // ==========================================
        // 1. Scratch & Reveal Game Logic
        // ==========================================
        const scratchCanvas = document.getElementById('scratch-canvas');
        const scratchCtx = scratchCanvas.getContext('2d', { willReadFrequently: true });
        const container = document.querySelector('.container');

        let isDrawing = false;
        let isRevealed = false;
        const brushSize = 50;

        // Ensure canvas matches its container's physical pixel dimensions
        function resizeScratchCanvas() {
            const rect = container.getBoundingClientRect();
            scratchCanvas.width = rect.width;
            scratchCanvas.height = rect.height;
            fillScratchLayer();
        }

        // Draw the top coating
        function fillScratchLayer() {
            if (isRevealed) return;
            const w = scratchCanvas.width;
            const h = scratchCanvas.height;

            // Create a premium metallic/carbon-like dark gradient for the cover
            const gradient = scratchCtx.createLinearGradient(0, 0, w, h);
            gradient.addColorStop(0, '#1a1b26');
            gradient.addColorStop(0.5, '#24283b');
            gradient.addColorStop(1, '#1a1b26');

            scratchCtx.fillStyle = gradient;
            scratchCtx.fillRect(0, 0, w, h);

            // Add a subtle texture overlay effect
            scratchCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let i = 0; i < h; i += 4) {
                scratchCtx.fillRect(0, i, w, 1);
            }

            // "Scratch Here" instructional text
            scratchCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            scratchCtx.font = '500 24px Outfit';
            scratchCtx.textAlign = 'center';
            scratchCtx.textBaseline = 'middle';
            scratchCtx.fillText('✧ Scratch to Reveal ✧', w / 2, h / 2);

            // Next operations will erase (make transparent) the canvas
            scratchCtx.globalCompositeOperation = 'destination-out';
        }

        function scratch(clientX, clientY) {
            if (!isDrawing || isRevealed) return;

            const rect = scratchCanvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // Draw a circle to erase
            scratchCtx.beginPath();
            scratchCtx.arc(x, y, brushSize, 0, Math.PI * 2);
            scratchCtx.fill();

            checkReveal();
        }

        function checkReveal() {
            // Optimization: check transparency pixels only occasionally
            if (Math.random() > 0.15) return;

            // Calculate how much of the canvas is transparent
            const pixels = scratchCtx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height).data;
            let transparentPixels = 0;
            const totalPixels = pixels.length / 4;

            // Check alpha channel (index 3, 7, 11...)
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] < 128) transparentPixels++; // Pixel is more than 50% transparent
            }

            // If user scratched more than 40% of the area, fade it out automatically
            if (transparentPixels / totalPixels > 0.4) {
                isRevealed = true;
                scratchCanvas.style.opacity = '0';

                // Add a nice fade out to the coin too
                const coinElement = document.getElementById('scratch-coin');
                coinElement.style.transition = 'opacity 1s ease';
                coinElement.style.opacity = '0';

                // Remove from DOM flow after fade transition
                setTimeout(() => {
                    scratchCanvas.style.pointerEvents = 'none';
                    coinElement.style.display = 'none';
                }, 1500);
            }
        }

        // --- Coin Dragging Logic ---
        const coin = document.getElementById('scratch-coin');
        const coinIcon = document.getElementById('coin-icon');
        const icons = ['🏈', '⚾', '⭐'];
        coinIcon.textContent = icons[Math.floor(Math.random() * icons.length)];

        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            if (isRevealed) return;
            isDrawing = true;
            coin.classList.add('dragging');

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const coinRect = coin.getBoundingClientRect();
            // Calculate where exactly inside the coin the user clicked
            offsetX = clientX - coinRect.left;
            offsetY = clientY - coinRect.top;
        }

        function drag(e) {
            if (!isDrawing) return;
            // Prevent scrolling/refreshing on mobile while dragging
            if (e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Move coin
            const newLeft = clientX - offsetX;
            const newTop = clientY - offsetY;

            coin.style.left = newLeft + 'px';
            coin.style.top = newTop + 'px';

            // Calculate center point of the coin for scratching
            const coinCenterX = newLeft + 40;
            const coinCenterY = newTop + 40;

            // Check if coin center is within the scratch canvas bounds
            const rect = scratchCanvas.getBoundingClientRect();
            if (coinCenterX >= rect.left && coinCenterX <= rect.right &&
                coinCenterY >= rect.top && coinCenterY <= rect.bottom) {
                scratch(coinCenterX, coinCenterY);
            }
        }

        function stopDrag() {
            isDrawing = false;
            coin.classList.remove('dragging');
        }

        coin.addEventListener('mousedown', startDrag);
        coin.addEventListener('touchstart', startDrag, { passive: false });

        window.addEventListener('mousemove', drag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        window.addEventListener('resize', resizeScratchCanvas);
        resizeScratchCanvas();

        // ==========================================
        // 2. Dynamic Star Particle System
        // ==========================================
        const starCanvas = document.getElementById('star-canvas');
        const starCtx = starCanvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000 }; // Start off-screen
        let lastInteractionTime = Date.now();

        function resizeStarCanvas() {
            width = starCanvas.width = window.innerWidth;
            height = starCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeStarCanvas);
        resizeStarCanvas();

        // Track user interaction for star generation
        function updateInteraction(x, y) {
            mouse.x = x;
            mouse.y = y;
            lastInteractionTime = Date.now();
            // Emit stars where the user moves
            createParticles(mouse.x, mouse.y, Math.floor(Math.random() * 2) + 1);
        }

        window.addEventListener('mousemove', (e) => updateInteraction(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => updateInteraction(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchstart', (e) => updateInteraction(e.touches[0].clientX, e.touches[0].clientY));

        class StarParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1; // Size of the star

                // Drift velocity
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 1.5;
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed;

                this.life = 1; // Alpha opacity
                this.decay = Math.random() * 0.015 + 0.005; // Fade speed

                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;

                // Premium color palette (white, cyan, blue, subtle gold)
                const colors = ['#ffffff', '#00f2fe', '#4facfe', '#ffd700'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                starCtx.save();
                starCtx.translate(this.x, this.y);
                starCtx.rotate(this.rotation);
                starCtx.globalAlpha = Math.max(0, this.life); // Ensure alpha is >= 0

                // Draw a 4-point shining star shape
                starCtx.beginPath();
                const spikes = 4;
                const outerRadius = this.size;
                const innerRadius = this.size * 0.3; // Make points sharper
                let rot = Math.PI / 2 * 3;
                let x, y;
                let step = Math.PI / spikes;

                starCtx.moveTo(0, 0 - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = Math.cos(rot) * outerRadius;
                    y = Math.sin(rot) * outerRadius;
                    starCtx.lineTo(x, y);
                    rot += step;

                    x = Math.cos(rot) * innerRadius;
                    y = Math.sin(rot) * innerRadius;
                    starCtx.lineTo(x, y);
                    rot += step;
                }
                starCtx.lineTo(0, 0 - outerRadius);
                starCtx.closePath();

                starCtx.fillStyle = this.color;
                starCtx.shadowBlur = 15; // Soft glow
                starCtx.shadowColor = this.color;
                starCtx.fill();

                starCtx.restore();
            }
        }

        function createParticles(x, y, count = 1) {
            for (let i = 0; i < count; i++) {
                particles.push(new StarParticle(x, y));
            }
        }

        function animateStars() {
            // Clear frame
            starCtx.clearRect(0, 0, width, height);

            // Random ambient generation:
            // If user hasn't moved mouse in 500ms (or on mobile device idling), randomly populate screen
            if (Date.now() - lastInteractionTime > 500) {
                // Throttle generation for performance
                if (Math.random() < 0.2) {
                    createParticles(Math.random() * width, Math.random() * height, 1);
                }
            }

            // Update and draw all active particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // Remove dead particles
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--; // Adjust index after array mutation
                }
            }

            requestAnimationFrame(animateStars);
        }

        // Start animation loop
        animateStars();
    </script>
</body>

</html>
